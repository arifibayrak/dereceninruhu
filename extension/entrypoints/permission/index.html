<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mikrofon izni — Canlı Transkript</title>
    <style>
      :root {
        color-scheme: light dark;
        --brand: #6d28d9;
        --brand-2: #8b5cf6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font: 15px/1.6 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      .card {
        max-width: 440px;
        width: 100%;
        border: 1px solid color-mix(in oklab, CanvasText 14%, Canvas);
        border-radius: 18px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(20, 20, 40, 0.12);
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--brand-2), var(--brand));
        color: #fff;
        font-size: 22px;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 18px;
        color: color-mix(in oklab, CanvasText 68%, Canvas);
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 11px 18px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(180deg, var(--brand-2), var(--brand));
        cursor: pointer;
      }
      .ok {
        color: #15803d;
      }
      .err {
        color: #b45309;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">🎙️</div>
      <h1>Mikrofon izni</h1>
      <p id="status">Mikrofon izni isteniyor…</p>
      <button id="retry" hidden>Tekrar dene</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
